# Fixed project name, so this lab's containers, volumes, and networks
# never collide with another lab that uses the same folder name.
name: secure-ai-qdrant-part5

services:
  # -------------------------------------------------------------------
  # Qdrant: the knowledge store
  # Internal only: no ports are published to your computer.
  # Its settings (admin key, JWT access control) come from a secret file.
  # -------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: rag-qdrant
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./secrets/qdrant_config.yaml:/qdrant/config/local.yaml:ro
    healthcheck:
      # The image has no curl or wget, so bash opens a TCP connection itself
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - internal

  # -------------------------------------------------------------------
  # qdrant-init: runs once with the ADMIN key to create the collection,
  # then exits. Nothing that keeps running ever holds the admin key.
  # -------------------------------------------------------------------
  qdrant-init:
    build:
      context: ./ingestion-api
    container_name: rag-qdrant-init
    restart: "no"
    command: ["python", "-m", "app.qdrant_init"]
    environment:
      QDRANT_URL: "http://qdrant:6333"
      APP_TENANT: "${APP_TENANT:-lab}"
      EMBED_DIM: "${EMBED_DIM:-768}"
    secrets:
      - qdrant_api_key
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - internal

  # -------------------------------------------------------------------
  # Ollama: local LLM + embedding model
  # -------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.40.6
    container_name: rag-ollama
    restart: unless-stopped
    mem_limit: 6g
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal

  # -------------------------------------------------------------------
  # Ingestion + RAG API (FastAPI)
  # -------------------------------------------------------------------
  ingestion-api:
    build:
      context: ./ingestion-api
    container_name: rag-api
    restart: unless-stopped
    mem_limit: 1g
    environment:
      EDGE_API_KEY: "${EDGE_API_KEY:?Run bin/setup_secrets.sh first}"
      APP_TENANT: "${APP_TENANT:-lab}"
      QDRANT_URL: "http://qdrant:6333"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:1b}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
      EMBED_DIM: "${EMBED_DIM:-768}"
      RAG_TOP_K: "${RAG_TOP_K:-4}"
      RAG_MAX_SOURCE_CHARS: "${RAG_MAX_SOURCE_CHARS:-1200}"
      ENABLE_DEBUG_ENDPOINTS: "${ENABLE_DEBUG_ENDPOINTS:-true}"
      OLLAMA_TEMPERATURE: "${OLLAMA_TEMPERATURE:-0}"
      # Prompt injection defenses (Part 3). Set in .env.
      GUARD_INPUT: "${GUARD_INPUT:-false}"
      GUARD_INGEST: "${GUARD_INGEST:-false}"
      GUARD_PROMPT: "${GUARD_PROMPT:-false}"
      PROMPT_SANITIZE: "${PROMPT_SANITIZE:-true}"
      GUARD_OUTPUT: "${GUARD_OUTPUT:-false}"
      ALLOWED_LINK_DOMAINS: "${ALLOWED_LINK_DOMAINS:-example.org}"
    secrets:
      - qdrant_writer_token
      - qdrant_reader_token
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - internal

  # -------------------------------------------------------------------
  # NGINX edge gateway: the only way into the API
  # -------------------------------------------------------------------
  nginx:
    image: nginx:1.28-alpine
    container_name: rag-nginx
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      EDGE_API_KEY: "${EDGE_API_KEY:?Run bin/setup_secrets.sh first}"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      ingestion-api:
        condition: service_healthy
    networks:
      - internal

  # -------------------------------------------------------------------
  # Gradio chat UI
  # -------------------------------------------------------------------
  gradio-ui:
    build:
      context: ./gradio-ui
    container_name: rag-ui
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      API_BASE_URL: "http://nginx:8088"
      EDGE_API_KEY: "${EDGE_API_KEY:?Run bin/setup_secrets.sh first}"
      GRADIO_HTTP_TIMEOUT_S: "${GRADIO_HTTP_TIMEOUT_S:-600}"
    depends_on:
      nginx:
        condition: service_started
    networks:
      - internal

secrets:
  qdrant_api_key:
    file: ./secrets/qdrant_api_key.txt
  qdrant_writer_token:
    file: ./secrets/qdrant_writer_token.txt
  qdrant_reader_token:
    file: ./secrets/qdrant_reader_token.txt

networks:
  internal:
    driver: bridge

volumes:
  qdrant_data:
  # Parts 3, 4, and 5 share one model volume, so models download only once.
  # bin/setup_secrets.sh creates this volume if it does not exist yet.
  ollama_data:
    name: secure-ai-qdrant_ollama_data
    external: true
